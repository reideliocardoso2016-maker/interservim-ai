name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          python -c "
          from app.core.config import settings
          from app.core.enums import *
          from app.models import *
          from app.schemas.schemas import *
          print('All backend modules imported successfully')
          "

      - name: Seed database
        run: |
          DATABASE_URL=sqlite:///./test.db python seed.py

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build APK
        run: |
          rm -rf android web
          flutter create --project-name interservim_ai_sales_agent --org com.interservim --platforms android,web .
          rm -f test/widget_test.dart
          echo "android.disableAarMetadataCheck=true" >> android/gradle.properties
          python3 $GITHUB_WORKSPACE/scripts/add_desugaring.py android/app/build.gradle.kts
          echo "=== build.gradle.kts content ==="
          cat android/app/build.gradle.kts
          echo "=== End ==="
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          set +e
          flutter build apk --release 2>&1 | tee build_output.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error title=Build APK::$(grep -A10 -m1 -E 'FAILURE:|What went wrong:|Execution failed' build_output.txt 2>/dev/null | tr '\n' ' '| head -c 1000)"
          fi
          exit $BUILD_EXIT

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-apk
          path: apps/mobile/flutter_app/build_output.txt
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: interservim-ai-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

  build-appbundle:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Generate Android project
        run: |
          rm -rf android web
          flutter create --project-name interservim_ai_sales_agent --org com.interservim --platforms android,web .
          rm -f test/widget_test.dart
          echo "android.disableAarMetadataCheck=true" >> android/gradle.properties
          python3 $GITHUB_WORKSPACE/scripts/add_desugaring.py android/app/build.gradle.kts
          echo "=== build.gradle.kts content ==="
          cat android/app/build.gradle.kts
          echo "=== End ==="
          flutter pub get

      - name: Build App Bundle
        run: |
          flutter build appbundle --release 2>&1 | tee build_output.txt
          set +e
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::group::Build error details"
            tail -100 build_output.txt
            echo "::endgroup::"
            echo "::error title=Build App Bundle::$(grep -A5 -m1 -E 'FAILURE:|What went wrong:' build_output.txt 2>/dev/null | tr '\n' ' ' | head -c 500)"
          fi
          exit $BUILD_EXIT

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-aab
          path: apps/mobile/flutter_app/build_output.txt
          retention-days: 7

      - name: Upload App Bundle artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: interservim-ai-release-aab
          path: apps/mobile/flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
