name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          python -c "
          from app.core.config import settings
          from app.core.enums import *
          from app.models import *
          from app.schemas.schemas import *
          print('All backend modules imported successfully')
          "

      - name: Seed database
        run: |
          DATABASE_URL=sqlite:///./test.db python seed.py

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Add desugaring to build.gradle.kts
        run: |
          python3 $GITHUB_WORKSPACE/scripts/add_desugaring.py android/app/build.gradle.kts
          echo "=== build.gradle.kts content ==="
          cat android/app/build.gradle.kts
          echo "=== End ==="

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: |
          set +e
          set -o pipefail
          flutter build apk --release 2>&1 | tee build_output.txt
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            ERROR_MSG=$(grep -A5 -m1 -E "FAILURE:|What went wrong:|line:" build_output.txt 2>/dev/null | tr '\n' ' ' | head -c 600)
            if [ -z "$ERROR_MSG" ]; then
              ERROR_MSG=$(grep -m1 -E "error:" build_output.txt 2>/dev/null | head -c 200)
            fi
            if [ -z "$ERROR_MSG" ]; then
              ERROR_MSG="Unknown build error"
            fi
            echo "::error title=Build APK::$ERROR_MSG"
            echo "--- Last 100 lines of build output ---"
            tail -100 build_output.txt
          fi
          exit $BUILD_EXIT

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-apk
          path: apps/mobile/flutter_app/build_output.txt
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: interservim-ai-release-apk
          path: apps/mobile/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-appbundle:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Add desugaring to build.gradle.kts
        run: |
          python3 $GITHUB_WORKSPACE/scripts/add_desugaring.py android/app/build.gradle.kts
          echo "=== build.gradle.kts content ==="
          cat android/app/build.gradle.kts
          echo "=== End ==="

      - name: Install dependencies
        run: flutter pub get

      - name: Build App Bundle
        run: |
          set +e
          set -o pipefail
          flutter build appbundle --release 2>&1 | tee build_output.txt
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            ERROR_MSG=$(grep -A5 -m1 -E "FAILURE:|What went wrong:|line:" build_output.txt 2>/dev/null | tr '\n' ' ' | head -c 600)
            if [ -z "$ERROR_MSG" ]; then
              ERROR_MSG=$(grep -m1 -E "error:" build_output.txt 2>/dev/null | head -c 200)
            fi
            if [ -z "$ERROR_MSG" ]; then
              ERROR_MSG="Unknown build error"
            fi
            echo "::error title=Build App Bundle::$ERROR_MSG"
            echo "--- Last 100 lines of build output ---"
            tail -100 build_output.txt
          fi
          exit $BUILD_EXIT

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-aab
          path: apps/mobile/flutter_app/build_output.txt
          retention-days: 7

      - name: Upload App Bundle artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: interservim-ai-release-aab
          path: apps/mobile/flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
