name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build APK
        run: |
          rm -rf android web
          flutter create --project-name interservim_ai_sales_agent --org com.interservim --platforms android,web .
          rm -f test/widget_test.dart
          python3 $GITHUB_WORKSPACE/scripts/modify_build.py android
          echo "=== modified build.gradle.kts ==="
          cat android/app/build.gradle.kts
          echo "=== modified root build.gradle ==="
          cat android/build.gradle
          echo "=== End ==="
          flutter pub get
          set +e
          flutter build apk --release 2>&1 | tee build_output.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          echo "=== FULL build output ($(wc -c < build_output.txt) bytes) ==="
          cat build_output.txt
          echo "=== END build output ==="
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error title=Build Error::$(cat build_output.txt | tr '\n' ' ' | head -c 3000)"
          fi
          exit $BUILD_EXIT

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: apps/mobile/flutter_app/build_output.txt
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: interservim-ai-release-apk
          path: apps/mobile/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
