name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL baked into the APK"
        required: false
        default: "https://architect-warren-sequences-reducing.trycloudflare.com/api/v1"

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/flutter_app
    env:
      API_BASE_URL: ${{ inputs.api_base_url || 'https://architect-warren-sequences-reducing.trycloudflare.com/api/v1' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build APK
        run: |
          set +e
          touch build_output.txt
          rm -rf android web
          echo "=== flutter create ===" | tee -a build_output.txt
          flutter create --project-name interservim_ai_sales_agent --org com.interservim --platforms android,web . 2>&1 | tee -a build_output.txt
          echo "CREATE_EXIT: ${PIPESTATUS[0]}" | tee -a build_output.txt
          rm -f test/widget_test.dart
          cp $GITHUB_WORKSPACE/scripts/build_template.gradle.kts android/app/build.gradle.kts
          echo "=== write init script ==="
          python3 $GITHUB_WORKSPACE/scripts/write_init_script.py 2>&1 | tee -a build_output.txt
          echo "=== flutter pub get ===" | tee -a build_output.txt
          flutter pub get 2>&1 | tee -a build_output.txt
          echo "PUB_EXIT: ${PIPESTATUS[0]}" | tee -a build_output.txt
          echo "=== patch jni ==="
          python3 $GITHUB_WORKSPACE/scripts/patch_jni.py 2>&1 | tee -a build_output.txt
          echo "=== flutter build ===" | tee -a build_output.txt
          flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL 2>&1 | tee -a build_output.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "BUILD_EXIT: $BUILD_EXIT" | tee -a build_output.txt
          echo "=== FULL BUILD OUTPUT (all) ==="
          cat build_output.txt
          echo "=== LAST 2000 BYTES ==="
          tail -c 2000 build_output.txt
          echo "=== END ==="
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error title=Build Error::$(tail -c 2000 build_output.txt | tr '\n' ' ')"
          fi
          exit $BUILD_EXIT

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: apps/mobile/flutter_app/build_output.txt
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: interservim-ai-release-apk
          path: apps/mobile/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
