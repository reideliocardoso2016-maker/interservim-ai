name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build APK
        run: |
          rm -rf android web
          flutter create --project-name interservim_ai_sales_agent --org com.interservim --platforms android,web .
          rm -f test/widget_test.dart
          # Modify generated build.gradle.kts to add @file:Suppress, compileSdk=36, desugaring
          python3 -c "
import re
with open('android/app/build.gradle.kts','r') as f:
    c = f.read()
c = '@file:Suppress(\"DEPRECATION\")\n\n' + c
c = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', c)
c = c.replace('targetCompatibility = JavaVersion.VERSION_11', 'targetCompatibility = JavaVersion.VERSION_17')
c = c.replace('targetCompatibility = JavaVersion.VERSION_1_8', 'targetCompatibility = JavaVersion.VERSION_17')
# add isCoreLibraryDesugaringEnabled
c = c.replace('targetCompatibility = JavaVersion.VERSION_17', 'targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true')
# add coreLibraryDesugaring dependency
c += '\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n'
with open('android/app/build.gradle.kts','w') as f:
    f.write(c)
"
          # Disable AAR metadata check in gradle.properties
          echo "android.disableAarMetadataCheck=true" >> android/gradle.properties
          echo "android.newDsl=false" >> android/gradle.properties
          echo "=== modified build.gradle.kts ==="
          cat android/app/build.gradle.kts
          echo "=== gradle.properties ==="
          cat android/gradle.properties
          echo "=== End ==="
          flutter pub get
          set +e
          flutter build apk --release 2>&1 | tee build_output.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          tail -100 build_output.txt
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error title=Build APK::$(grep -A10 -m1 -E 'FAILURE:|What went wrong:|Execution failed' build_output.txt 2>/dev/null | tr '\n' ' ' | head -c 2000)"
          fi
          exit $BUILD_EXIT

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: apps/mobile/flutter_app/build_output.txt
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: interservim-ai-release-apk
          path: apps/mobile/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
