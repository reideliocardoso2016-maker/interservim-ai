name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build APK
        run: |
          set +e
          touch build_output.txt
          rm -rf android web
          echo "=== flutter create ===" | tee -a build_output.txt
          flutter create --project-name interservim_ai_sales_agent --org com.interservim --platforms android,web . 2>&1 | tee -a build_output.txt
          echo "CREATE_EXIT: ${PIPESTATUS[0]}" | tee -a build_output.txt
          rm -f test/widget_test.dart
          cp $GITHUB_WORKSPACE/scripts/build_template.gradle.kts android/app/build.gradle.kts
          python3 $GITHUB_WORKSPACE/scripts/modify_build.py android
          echo "=== flutter pub get ===" | tee -a build_output.txt
          flutter pub get 2>&1 | tee -a build_output.txt
          echo "PUB_EXIT: ${PIPESTATUS[0]}" | tee -a build_output.txt
          echo "=== flutter build ===" | tee -a build_output.txt
          flutter build apk --release 2>&1 | tee -a build_output.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "BUILD_EXIT: $BUILD_EXIT" | tee -a build_output.txt
          echo "=== FULL BUILD OUTPUT ==="
          cat build_output.txt
          echo "=== END ==="
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error title=Build Error::$(cat build_output.txt | tail -100 | tr '\n' ' ' | head -c 3000)"
          fi
          exit $BUILD_EXIT

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: apps/mobile/flutter_app/build_output.txt
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: interservim-ai-release-apk
          path: apps/mobile/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
